name: Deploy MkDocs Material Site

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build static HTML
        # ЗАМЕНИТЕ "my-site-folder" НА РЕАЛЬНОЕ НАЗВАНИЕ ВАШЕЙ ПАПКИ С САЙТОМ:
        run: |
          cd my-site-folder
          mkdocs build --clean --site-dir ./_compiled_site

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Указываем точный путь к скомпилированной папке внутри вашего проекта
          path: './metrics_book/_compiled_site'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
